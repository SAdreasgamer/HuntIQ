[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "huntiq"
version = "0.1.0"
description = "AI-Powered Recruitment Intelligence Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "HuntIQ Team"},
]
keywords = ["job-search", "ai", "recruitment", "automation", "career"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Typing :: Typed",
]

dependencies = [
    # Web Framework
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "python-multipart>=0.0.12",

    # Database
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "alembic>=1.14.0,<2.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",

    # Validation & Serialization
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",

    # HTTP Clients
    "httpx>=0.28.0,<1.0.0",
    "aiohttp>=3.11.0,<4.0.0",

    # Task Queue & Scheduling
    "celery[redis]>=5.4.0,<6.0.0",
    "redis>=5.2.0,<6.0.0",
    "apscheduler>=3.10.0,<4.0.0",

    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",

    # Resume Parsing
    "pymupdf>=1.25.0",
    "pdfplumber>=0.11.0",

    # Embeddings
    "sentence-transformers>=3.3.0",
    "numpy>=2.1.0,<3.0.0",

    # Reporting
    "pandas>=2.2.0,<3.0.0",
    "openpyxl>=3.1.0,<4.0.0",

    # Logging
    "structlog>=24.4.0",

    # Templating (Dashboard)
    "jinja2>=3.1.0,<4.0.0",

    # Notifications
    "aiosmtplib>=3.0.0",
    "desktop-notifier>=6.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.0",
    "faker>=33.0.0",

    # Code Quality
    "black>=24.10.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",

    # Type Stubs
    "types-redis>=4.6.0",
    "types-passlib>=1.7.7",
    "types-python-jose>=3.3.0",
    "pandas-stubs>=2.2.0",
    "sqlalchemy-stubs>=0.4",

    # Debug
    "ipython>=8.29.0",
    "rich>=13.9.0",
]

prod = [
    "gunicorn>=23.0.0",
]

[project.scripts]
huntiq = "app.core.cli:main"

[project.urls]
Homepage = "https://github.com/SAdreasgamer/HuntIQ"
Repository = "https://github.com/SAdreasgamer/HuntIQ"
Issues = "https://github.com/SAdreasgamer/HuntIQ/issues"

# ============================================================
# Tool Configuration
# ============================================================

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

# ============================================================
# Black — Code Formatter
# ============================================================

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

# ============================================================
# Ruff — Linter
# ============================================================

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific rules
    "ASYNC",  # flake8-async
]
ignore = [
    "E501",   # line too long (handled by black)
    "COM812", # trailing comma (conflicts with black)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["T20"]  # allow print in tests
"backend/app/api/*" = ["B008"]  # allow Depends() in routes

# ============================================================
# MyPy — Static Type Checker
# ============================================================

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "backend"

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "apscheduler.*",
    "pymupdf.*",
    "fitz.*",
    "pdfplumber.*",
    "sentence_transformers.*",
    "desktop_notifier.*",
    "aiosmtplib.*",
]
ignore_missing_imports = true

# ============================================================
# Pytest — Test Configuration
# ============================================================

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--no-header",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, use database)",
    "slow: Slow tests (external APIs, large data)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ============================================================
# Coverage — Test Coverage
# ============================================================

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "\\.\\.\\.",
]
