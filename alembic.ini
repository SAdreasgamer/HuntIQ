# HuntIQ — Alembic Configuration
# ================================
# Database migration tool configuration.
# The actual database URL is loaded from .env via the env.py script.

[alembic]
# Path to migration scripts (relative to this file)
script_location = backend/alembic

# Template used for generating new migration files
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate long revision IDs in filenames
truncate_slug_length = 40

# Set to 'true' to run the environment during 'alembic revision'
# to generate SQL for offline migrations
# revision_environment = false

# Timezone for migration timestamps
timezone = UTC

# Separator for rendered SQL output (offline mode)
output_encoding = utf-8

# The database URL is injected programmatically in env.py
# Do NOT set sqlalchemy.url here
# sqlalchemy.url =

[post_write_hooks]
# Run black on generated migration files
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = --config pyproject.toml

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
